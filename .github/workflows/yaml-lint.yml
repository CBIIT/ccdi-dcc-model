name: YAML Syntax Check

on:
  push:
    paths:
      - 'model-desc/property_yamls/**.yml'
      - 'model-desc/property_yamls/**.yaml'
  pull_request:
    paths:
      - 'model-desc/property_yamls/**.yml'
      - 'model-desc/property_yamls/**.yaml'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files (syntax only)
        run: |
         yamllint -d "{rules: {}}" model-desc/property_yamls/
         
