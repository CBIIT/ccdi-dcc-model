name: YAML Parse Check

on:
  push:
    paths:
      - 'model-desc/property_yamls/**.yml'
      - 'model-desc/property_yamls/**.yaml'
  pull_request:
    paths:
      - 'model-desc/property_yamls/**.yml'
      - 'model-desc/property_yamls/**.yaml'

jobs:
  yaml-parse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Parse all YAML files
        run: |
          python - <<'EOF'
          import sys, glob, yaml

          folder = "model-desc/property_yamls"
          files = glob.glob(f"{folder}/**/*.yml", recursive=True) + \
                  glob.glob(f"{folder}/**/*.yaml", recursive=True)

          failed = False
          for path in sorted(files):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      yaml.safe_load(f)
                  print(f"OK   {path}")
              except yaml.YAMLError as e:
                  failed = True
                  print(f"FAIL {path}\n{e}\n")
                  

          if failed:
              sys.exit(1)
          print(f"\nChecked {len(files)} file(s).")
          EOF
